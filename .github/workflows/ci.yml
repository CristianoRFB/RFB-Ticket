name: RFBTicket verification
on:
  pull_request:
  push:
    branches:
      - feature/rfb-starter-pack-v1
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node API sandbox tests (no external services)
        run: node --experimental-sqlite --test tests/api.node-test.mjs
      - name: Domain model
        run: node --experimental-strip-types --test tests/ticketDomain.node-test.mjs
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies from registry
        run: npm install --no-audit --no-fund
      - name: Static type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
  browser-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser (sandbox demo only)
        run: npx playwright install --with-deps chromium
      - name: Real browser QA (synthetic demo only)
        run: npm run test:e2e
      - name: Retain failure artifacts (synthetic fixtures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-failures
          path: test-results/
          retention-days: 3
